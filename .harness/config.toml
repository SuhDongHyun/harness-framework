[harness]
# Total attempts per step, including the initial execution.
max_retries = 3
timeout_seconds = 1800
verification_timeout_seconds = 900
# Agent JSONL history, structured final output, individual tool output fields,
# and controller verification streams have independent evidence budgets.
max_event_log_bytes = 1000000
max_final_payload_bytes = 200000
max_tool_output_bytes = 20000
max_verification_output_bytes = 200000
codex_command = "codex"

[harness.planner]
model = "gpt-5.6-sol"
reasoning_effort = "high"

[harness.executor]
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"

[harness.reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "high"

[harness.parallel_readers]
enabled = true
max_workers = 3
model = "gpt-5.6-terra"
reasoning_effort = "medium"

[harness.parallel_writers]
enabled = false
max_workers = 2

[harness.network]
# Network remains disabled unless an approved plan step also requests it.
executor_enabled = true
