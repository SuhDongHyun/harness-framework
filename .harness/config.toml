[harness]
# Total attempts per step, including the initial execution.
max_retries = 3
timeout_seconds = 1800
verification_timeout_seconds = 900
max_output_bytes = 200000
codex_command = "codex"

[harness.planner]
model = "gpt-5.6-sol"
reasoning_effort = "high"

[harness.executor]
model = "gpt-5.6-luna"
reasoning_effort = "xhigh"

[harness.reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "high"

[harness.parallel_readers]
enabled = true
max_workers = 3
model = "gpt-5.6-luna"
reasoning_effort = "medium"

[harness.parallel_writers]
enabled = false
max_workers = 2
